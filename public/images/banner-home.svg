<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of cozy rental homes at golden hour">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeeda"/>
      <stop offset="0.55" stop-color="#f6e0c4"/>
      <stop offset="1" stop-color="#f1d3ab"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c7b2"/>
      <stop offset="1" stop-color="#c9b49b"/>
    </linearGradient>
    <linearGradient id="roofMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9760f"/>
      <stop offset="1" stop-color="#b8600b"/>
    </linearGradient>
    <linearGradient id="roofAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2610c"/>
      <stop offset="1" stop-color="#9c4d09"/>
    </linearGradient>
    <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6ad"/>
      <stop offset="1" stop-color="#f7c765"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="900" rx="48" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="915" cy="245" r="120" fill="#fbd58a" opacity="0.75"/>
  <circle cx="915" cy="245" r="82" fill="#f9c25f"/>

  <!-- clouds -->
  <g fill="#fff7ea" opacity="0.85">
    <ellipse cx="290" cy="200" rx="96" ry="34"/>
    <ellipse cx="360" cy="185" rx="70" ry="28"/>
    <ellipse cx="760" cy="140" rx="80" ry="28"/>
    <ellipse cx="820" cy="128" rx="54" ry="22"/>
  </g>

  <!-- distant hills -->
  <path d="M0 640 Q 300 540 620 620 T 1200 600 L 1200 900 L 0 900 Z" fill="#cdb99f"/>
  <path d="M0 700 Q 360 620 720 690 T 1200 670 L 1200 900 L 0 900 Z" fill="url(#ground)"/>

  <!-- back house (left) -->
  <g>
    <rect x="150" y="470" width="210" height="220" rx="10" fill="#efe4d4"/>
    <path d="M135 480 L255 388 L375 480 Z" fill="url(#roofAlt)"/>
    <rect x="190" y="520" width="52" height="52" rx="6" fill="url(#winGlow)"/>
    <rect x="272" y="520" width="52" height="52" rx="6" fill="url(#winGlow)"/>
    <rect x="228" y="600" width="56" height="90" rx="6" fill="#a9865f"/>
  </g>

  <!-- back house (right) -->
  <g>
    <rect x="840" y="500" width="200" height="190" rx="10" fill="#e9ddcb"/>
    <path d="M826 508 L940 424 L1054 508 Z" fill="url(#roofAlt)"/>
    <rect x="876" y="545" width="48" height="48" rx="6" fill="url(#winGlow)"/>
    <rect x="956" y="545" width="48" height="48" rx="6" fill="url(#winGlow)"/>
    <rect x="912" y="620" width="56" height="70" rx="6" fill="#a9865f"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="112" y="600" width="20" height="90" rx="8" fill="#8a6f4c"/>
    <circle cx="122" cy="580" r="52" fill="#7f8f5a"/>
    <circle cx="92" cy="600" r="38" fill="#8fa066"/>
    <circle cx="152" cy="602" r="40" fill="#93a469"/>
  </g>
  <g>
    <rect x="1070" y="600" width="18" height="86" rx="8" fill="#8a6f4c"/>
    <circle cx="1079" cy="586" r="46" fill="#7f8f5a"/>
    <circle cx="1052" cy="604" r="34" fill="#8fa066"/>
  </g>

  <!-- main house -->
  <g>
    <rect x="430" y="470" width="360" height="270" rx="14" fill="#f7efe2"/>
    <rect x="430" y="470" width="360" height="270" rx="14" fill="#000" opacity="0.04"/>
    <!-- roof -->
    <path d="M406 486 L610 330 L814 486 Z" fill="url(#roofMain)"/>
    <path d="M610 330 L814 486 L790 486 L610 356 Z" fill="#000" opacity="0.08"/>
    <!-- chimney -->
    <rect x="720" y="372" width="40" height="72" rx="6" fill="#a04f0a"/>
    <!-- door -->
    <rect x="556" y="616" width="108" height="124" rx="10" fill="#b5701f"/>
    <rect x="556" y="616" width="108" height="124" rx="10" fill="#000" opacity="0.08"/>
    <circle cx="646" cy="682" r="6" fill="#ffe6ad"/>
    <!-- windows -->
    <g>
      <rect x="470" y="540" width="86" height="86" rx="8" fill="url(#winGlow)"/>
      <rect x="664" y="540" width="86" height="86" rx="8" fill="url(#winGlow)"/>
      <path d="M513 540 L513 626 M470 583 L556 583" stroke="#c98a3a" stroke-width="6"/>
      <path d="M707 540 L707 626 M664 583 L750 583" stroke="#c98a3a" stroke-width="6"/>
    </g>
  </g>

  <!-- floating location-heart pin (nest) -->
  <g>
    <ellipse cx="610" cy="300" rx="46" ry="12" fill="#000" opacity="0.06"/>
    <path d="M610 168 C 660 168 700 208 700 258 C 700 322 610 372 610 372 C 610 372 520 322 520 258 C 520 208 560 168 610 168 Z" fill="#c2610c"/>
    <path d="M610 168 C 660 168 700 208 700 258 C 700 322 610 372 610 372 C 610 372 520 322 520 258 C 520 208 560 168 610 168 Z" fill="#fff" opacity="0.08"/>
    <path d="M610 300 c -26 -20 -44 -34 -44 -54 c 0 -14 10 -24 24 -24 c 8 0 16 4 20 12 c 4 -8 12 -12 20 -12 c 14 0 24 10 24 24 c 0 20 -18 34 -44 54 Z" fill="#fff7ea"/>
  </g>
</svg>
